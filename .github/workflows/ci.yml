name: Offline checks

on:
  push:
    branches: [main]
    paths:
      - 'skill/**'
      - 'scripts/**'
      - 'tests/**'
      - 'examples/**'
      - 'install.py'
      - 'release-files.txt'
      - '.github/workflows/ci.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Only public repositories: standard hosted runner use is free and unlimited.
    # No model calls, caches, uploaded artifacts, secrets or paid runners.
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Run isolated offline tests
        run: python -I -m unittest discover -s tests -v
      - name: Validate the public package
        run: python scripts/check_package.py
